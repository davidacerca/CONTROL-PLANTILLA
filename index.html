
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acerca | Gestión interna</title>

<style>
:root {
  --bg:#f3f5f9;
  --white:#fff;
  --nav:#17243a;
  --ink:#1b2638;
  --muted:#68758a;
  --line:#e2e7ef;
  --accent:#5149c6;
  --purple:#eeeaff;
  --green:#159b70;
  --greenbg:#e8f7f1;
  --amber:#bc791f;
  --amberbg:#fff4e5;
  --red:#cf5662;
  --redbg:#fff0f1;
  --blue:#397fc0;
  --bluebg:#edf6ff;
  --shadow:0 10px 28px rgba(30,43,68,.055);
  --radius:16px;
}

* { box-sizing:border-box; }

body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}

button,input,select,textarea { font:inherit; }
button { cursor:pointer; }

.auth-screen {
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;
  background:
    radial-gradient(circle at 15% 15%,#e8e7ff,transparent 35%),
    radial-gradient(circle at 90% 85%,#e7f2ff,transparent 32%),
    var(--bg);
}

.auth-card {
  width:min(100%,430px);
  background:white;
  border:1px solid var(--line);
  border-radius:22px;
  padding:34px;
  box-shadow:0 24px 70px #1b27451f;
}

.brand { display:flex;align-items:center;gap:11px; }

.brandmark {
  width:42px;
  height:42px;
  border-radius:14px;
  background:linear-gradient(135deg,#9186ff,#5e52cf);
  display:grid;
  place-items:center;
  color:white;
  font-size:21px;
  font-weight:850;
}

.brand strong { display:block;font-size:20px; }

.brand small {
  display:block;
  color:#8490a3;
  font-size:10px;
  letter-spacing:1.6px;
  margin-top:2px;
}

.auth-card h1 { font-size:23px;margin:28px 0 6px; }
.sub { color:var(--muted);font-size:13px; }

.field { display:grid;gap:6px;margin:15px 0; }

.field label {
  font-size:12px;
  font-weight:700;
  color:#39465b;
}

.field input,.field select,.field textarea {
  width:100%;
  border:1px solid #e0e6ef;
  border-radius:11px;
  padding:12px;
  outline:none;
  background:white;
}

.field input:focus,.field select:focus,.field textarea:focus {
  border-color:#786df0;
  box-shadow:0 0 0 3px #786df01c;
}

.btn {
  border:1px solid var(--line);
  background:white;
  color:#354158;
  padding:10px 14px;
  border-radius:10px;
  font-size:12px;
  font-weight:700;
  transition:background .15s,border-color .15s,color .15s,transform .15s,box-shadow .15s;
}

.btn:not(:disabled):hover { border-color:#c8cde0;box-shadow:0 3px 10px #1723380d;transform:translateY(-1px); }
.btn.primary:not(:disabled):hover { background:#443cae;border-color:#443cae; }

.btn.primary,.auth-submit {
  background:var(--accent);
  border:1px solid var(--accent);
  color:white;
}

.btn:disabled { opacity:.5;cursor:not-allowed; }

.analysis-filters { display:flex;align-items:end;gap:10px;flex-wrap:wrap;padding:16px;margin-bottom:17px;background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow); }
.analysis-filters .field { min-width:145px;flex:1;margin:0; }
.analysis-filters .field input,.analysis-filters .field select { height:40px;padding:0 10px;background:#fff; }
.report-fields { flex:1 0 100%;border-top:1px solid var(--line);padding-top:10px;margin-top:2px; }
.report-fields summary { color:var(--accent);font-size:12px;font-weight:700; }
.report-field-list { display:flex;gap:8px 18px;flex-wrap:wrap;padding:12px 2px 2px; }
.report-field { display:flex;align-items:center;gap:7px;color:#455268;font-size:12px; }
.report-field input { accent-color:var(--accent); }
.analysis-stats .stat { min-width:0; }
.analysis-table { margin-top:3px; }
.analysis-table .table td,.analysis-table .table th { font-size:11px; }
.print-report { display:none; }
.nav button { transition:background .15s,color .15s,transform .15s; }
.nav button.active { background:#5148b7;box-shadow:inset 3px 0 #c8c3ff; }
.card { transition:box-shadow .15s,border-color .15s; }
.table th { color:#667289;background:#f8f9fc; }
.pill { letter-spacing:.1px; }

.auth-submit {
  width:100%;
  height:46px;
  border-radius:11px;
  font-weight:750;
  margin-top:8px;
}

.auth-message {
  display:none;
  margin-top:14px;
  border-radius:10px;
  padding:11px 12px;
  font-size:12px;
}

.auth-message.error { display:block;background:var(--redbg);color:#a83f4a; }
.auth-message.info { display:block;background:var(--bluebg);color:#356c9d; }

.auth-foot {
  border-top:1px solid #eef1f6;
  margin-top:22px;
  padding-top:16px;
  color:#8994a5;
  font-size:11px;
}

.app { display:none!important;min-height:100vh; }

body.acerca-authenticated .app { display:flex!important; }
body.acerca-authenticated .auth-screen { display:none!important; }

.sidebar {
  width:250px;
  background:var(--nav);
  color:white;
  position:fixed;
  inset:0 auto 0 0;
  padding:23px 14px;
  display:flex;
  flex-direction:column;
  z-index:10;
  overflow:auto;
}

.sidebrand { padding:0 8px 24px; }
.sidebrand .brandmark { width:38px;height:38px; }

.navlabel {
  font-size:10px;
  color:#8290a8;
  letter-spacing:1.5px;
  text-transform:uppercase;
  padding:12px 11px 7px;
}

.nav { display:grid;gap:4px; }

.nav button {
  border:0;
  background:transparent;
  color:#bbc5d4;
  text-align:left;
  padding:11px;
  border-radius:10px;
  display:flex;
  align-items:center;
  gap:11px;
  font-size:13px;
}

.nav button:hover { background:#ffffff12;color:white; }
.nav button.active { background:#6c61d9;color:white; }

.nav button svg {
  width:18px;
  height:18px;
  flex-shrink:0;
}
.navicon { color:currentColor;opacity:.84; }
.nav button.active .navicon { opacity:1; }

.section-nav { display:flex;gap:6px;flex-wrap:wrap;padding:5px;margin:0 0 16px;background:#e9edf5;border-radius:11px;width:max-content;max-width:100%; }
.section-tab { border:0;background:transparent;color:#58657a;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:650; }
.section-tab:hover { background:#ffffffa8;color:#263249; }
.section-tab.active { background:#fff;color:#3f389f;box-shadow:0 1px 3px #27334814; }
.import-company-list { margin:12px 0;padding:12px 14px;background:#f7f8fc;border:1px solid var(--line);border-radius:12px; }
.import-company-list p { margin:3px 0 8px;font-size:12px;color:var(--muted); }
.import-company { display:grid;grid-template-columns:minmax(150px,.7fr) minmax(220px,1.3fr);align-items:center;gap:12px;padding:7px 0;border-top:1px solid var(--line); }
.import-company label { font-size:12px;font-weight:650;color:var(--ink); }
.import-company label small { display:block;margin-top:4px;color:var(--muted);font-weight:400; }
.import-company select { width:100%;min-height:38px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:white;color:var(--ink); }
.worker-search-field { position:relative; }
.worker-suggestions { position:absolute;z-index:30;left:0;right:0;top:calc(100% - 10px);max-height:240px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 28px #14203924;padding:5px; }
.worker-suggestion { display:flex;width:100%;flex-direction:column;gap:2px;text-align:left;padding:9px 10px;border:0;border-radius:7px;background:transparent;color:var(--ink); }
.worker-suggestion:hover,.worker-suggestion:focus-visible { background:#f1f0ff;color:#3f389f; }
.worker-suggestion small,.worker-no-match { color:var(--muted);font-size:11px; }
.worker-no-match { padding:10px; }
.profile-summary { display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px;background:#f7f8fc;border:1px solid var(--line);border-radius:12px;margin-bottom:14px; }
.profile-summary h3 { margin:0 0 4px;font-size:16px; }
.profile-summary p { margin:3px 0;color:var(--muted);font-size:12px; }
.profile-grid { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px; }
.profile-block { min-width:0;border:1px solid var(--line);border-radius:11px;padding:12px; }
.profile-block h3 { margin:0 0 7px;font-size:12px; }
.profile-block .detailrow { padding:7px 0;font-size:11px; }
.profile-block small { color:var(--muted); }

.sidebottom {
  margin-top:auto;
  border-top:1px solid #ffffff20;
  padding:15px 8px 0;
  font-size:12px;
}

.sidebottom small {
  display:block;
  color:#91a0b8;
  margin-top:3px;
  overflow-wrap:anywhere;
}

.main {
  margin-left:250px;
  width:calc(100% - 250px);
  min-height:100vh;
}

.topbar {
  height:70px;
  background:#ffffffed;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
  position:sticky;
  top:0;
  z-index:5;
}

.crumb { color:var(--muted);font-size:12px; }
.crumb b { color:#29354a; }

.topright {
  display:flex;
  align-items:center;
  gap:12px;
  font-size:12px;
  font-weight:700;
}

.avatar {
  width:31px;
  height:31px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#dcd9ff;
  color:#4e45b2;
  font-weight:800;
}

.signout-btn {
  border:1px solid var(--line);
  background:white;
  color:#59657a;
  border-radius:9px;
  padding:8px 10px;
  font-size:11px;
  font-weight:700;
}

.content {
  max-width:1450px;
  margin:auto;
  padding:29px 32px 50px;
}

.head {
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:14px;
  flex-wrap:wrap;
  margin-bottom:22px;
}

.eyebrow {
  color:var(--accent);
  font-size:10px;
  letter-spacing:1.6px;
  font-weight:800;
  margin-bottom:7px;
}

.head h1 { font-size:25px;letter-spacing:-.7px;margin:0 0 5px; }
.head p { margin:0;color:var(--muted);font-size:13px; }
.actions { display:flex;gap:8px;flex-wrap:wrap; }

.grid { display:grid;gap:15px; }
.stats { grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:17px; }

.card {
  background:white;
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

.stat { padding:17px 18px; }

.stathead {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  color:var(--muted);
  font-size:12px;
}

.staticon {
  width:34px;
  height:34px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:var(--purple);
  color:var(--accent);
  font-size:16px;
}

.staticon svg { width:19px;height:19px; }
.icon { width:16px;height:16px;vertical-align:-3px;margin-right:6px; }
button:focus-visible,[role="button"]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible { outline:3px solid #8a81f2;outline-offset:2px; }

.value { font-size:27px;font-weight:800;letter-spacing:-1px;margin:10px 0 2px; }
.foot { font-size:11px;color:var(--muted); }

.clickable { cursor:pointer;transition:.15s; }
.clickable:hover { border-color:#bdb5ff;transform:translateY(-2px); }

.wide {
  padding:17px 19px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:16px;
}

.wide b { font-size:12px; }
.wide small { display:block;color:var(--muted);font-size:11px;margin-top:3px; }

.tablewrap { overflow:auto; }
.table { width:100%;border-collapse:collapse;text-align:left; }

.table th {
  background:#fafbfd;
  color:#8993a4;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.7px;
  padding:13px 15px;
  border-bottom:1px solid var(--line);
  white-space:nowrap;
}

.table td {
  padding:13px 15px;
  border-bottom:1px solid #f0f2f6;
  font-size:12px;
  color:#3a465c;
}

.table tr:last-child td { border-bottom:0; }

.empty-state {
  text-align:center;
  padding:35px 20px!important;
  color:var(--muted)!important;
  white-space:normal!important;
}

.empty-icon {
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  margin:0 auto 10px;
  border-radius:13px;
  background:var(--purple);
  color:var(--accent);
  font-size:19px;
}
.empty-icon svg { width:19px;height:19px; }
.btn svg { width:16px;height:16px;vertical-align:-3px;margin-right:6px; }

.pill {
  display:inline-block;
  padding:5px 8px;
  border-radius:20px;
  font-size:10px;
  font-weight:750;
}

.green { background:var(--greenbg);color:var(--green); }
.amber { background:var(--amberbg);color:var(--amber); }
.red { background:var(--redbg);color:var(--red); }
.blue { background:var(--bluebg);color:var(--blue); }
.gray { background:#f0f2f5;color:#657187; }

.toolbar {
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:13px;
}

.range {
  display:flex;
  gap:8px;
  align-items:end;
  flex-wrap:wrap;
}

.range label {
  font-size:10px;
  color:var(--muted);
  display:grid;
  gap:4px;
}

.range input {
  height:38px;
  border:1px solid var(--line);
  border-radius:9px;
  padding:0 10px;
  background:white;
  color:#58647a;
}

.notice {
  margin:13px 0;
  background:#f5f6ff;
  border:1px solid #e8e6ff;
  color:#6558b5;
  padding:11px 13px;
  border-radius:10px;
  font-size:11px;
}

.panel { padding:18px; }
.panel h3 { font-size:14px;margin:0 0 7px; }
.panel p { color:var(--muted);font-size:12px;margin:0 0 12px; }

.calendar {
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
  text-align:center;
}

.calendar span {
  padding:8px 0;
  color:#8994a5;
  font-size:10px;
}

.calendar button {
  border:0;
  border-radius:8px;
  padding:10px 0;
  background:#fff;
  color:#27354c;
  font-size:11px;
}

.calendar button.hasvac {
  background:#eeeaff;
  color:#5145c7;
  font-weight:800;
}

.calendar button:hover { outline:1px solid var(--accent); }

.modalback {
  display:none;
  position:fixed;
  inset:0;
  background:#10182a80;
  z-index:20;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modalback.show { display:flex; }

.modal {
  background:white;
  border-radius:16px;
  width:min(650px,100%);
  max-height:90vh;
  overflow:auto;
  box-shadow:0 24px 80px #0b122455;
}

.modalhead,.modalfoot {
  padding:17px 20px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.modalfoot {
  border-top:1px solid var(--line);
  border-bottom:0;
  justify-content:flex-end;
  gap:8px;
}

.modalbody { padding:20px; }
.modalhead h2 { font-size:16px;margin:0; }

.close {
  border:0;
  background:white;
  font-size:22px;
  color:#8994a5;
}

.detailrow {
  padding:12px 0;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-size:12px;
}

.toast {
  position:fixed;
  right:20px;
  bottom:20px;
  background:#172338;
  color:white;
  padding:12px 16px;
  border-radius:10px;
  opacity:0;
  transition:.2s;
  z-index:30;
  pointer-events:none;
}

.toast.show { opacity:1; }
.mobilemenu { display:none; }

@media(max-width:1100px) {
  .stats { grid-template-columns:repeat(2,minmax(0,1fr)); }
}

@media(max-width:700px) {
  .sidebar {
    width:260px;
    transform:translateX(-100%);
    transition:.2s;
  }

  .sidebar.open { transform:translateX(0); }

  .main { margin:0;width:100%; }
  .mobilemenu { display:inline-flex; }
  .topbar { padding:0 15px; }
  .content { padding:20px 14px; }
  .stats { grid-template-columns:1fr 1fr; }
  .head { display:block; }
  .actions { margin-top:13px; }
  .topright #currentAdminEmail { display:none; }
  .analysis-filters .field { min-width:calc(50% - 8px); }
  .analysis-filters>.btn { flex:1; }
  .section-nav { width:100%;overflow-x:auto;flex-wrap:nowrap; }
  .section-tab { white-space:nowrap; }
  .profile-grid { grid-template-columns:1fr; }
  .profile-summary { align-items:flex-start;flex-direction:column; }
  .import-company { grid-template-columns:1fr;gap:5px; }
}

@media(max-width:420px) {
  .stats { grid-template-columns:1fr; }
  .auth-card { padding:25px; }
}
</style>
</head>

<body>

<!-- ACCESO -->
<div class="auth-screen" id="authScreen">
  <main class="auth-card">
    <div class="brand">
      <div class="brandmark">A</div>
      <div>
        <strong>Acerca</strong>
        <small>GESTIÓN INTERNA</small>
      </div>
    </div>

    <h1>Acceso a la plataforma</h1>
    <p class="sub">Introduce tus credenciales de administración para continuar.</p>

    <form id="loginForm">
      <div class="field">
        <label for="loginEmail">Correo electrónico</label>
        <input id="loginEmail" type="email" autocomplete="username"
          placeholder="administracion@empresa.com" required>
      </div>

      <div class="field">
        <label for="loginPassword">Contraseña</label>
        <input id="loginPassword" type="password"
          autocomplete="current-password" required>
      </div>

      <button class="auth-submit" id="loginButton" type="submit">
        Iniciar sesión
      </button>

      <div class="auth-message" id="authMessage"
        role="status" aria-live="polite"></div>
    </form>

    <div class="auth-foot">
      Acceso restringido a usuarios autorizados por Acerca.
      No existe registro público.
    </div>
  </main>
</div>

<!-- APLICACIÓN -->
<div class="app">
  <aside class="sidebar" id="sidebar">

    <div class="sidebrand">
      <div class="brand">
        <div class="brandmark">A</div>
        <div>
          <strong>Acerca</strong>
          <small>GESTIÓN INTERNA</small>
        </div>
      </div>
    </div>

    <nav class="nav" id="mainNav">
      <button class="active" data-page="inicio">
        <svg class="navicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="10" width="8" height="11" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/></svg>Inicio
      </button>
      <button data-page="trabajadores" data-group="personas">
        <svg class="navicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Personas
      </button>
      <button data-page="vacaciones" data-group="personas">
        <svg class="navicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>Vacaciones y ausencias
      </button>
      <button data-page="pagos" data-group="pagos">
        <svg class="navicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18M8 6v4l2 1"/></svg>Pagos
      </button>
      <button data-page="analisis" data-group="analisis">
        <svg class="navicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-5 5"/><path d="M15 9h4v4"/></svg>Análisis
      </button>
      <button data-page="configuracion" data-group="configuracion">
