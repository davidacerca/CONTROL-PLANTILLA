name: Publicar Acerca

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Habilita Pages si todavía no existe el sitio del repositorio.
          enablement: true

      - name: Preparar archivos de Acerca
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Publicar Acerca
        id: deployment
        uses: actions/deploy-pages@v4
